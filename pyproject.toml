[project]
name = "pet-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "crashpf"}
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
pet-classifier = "pet_classifier:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
